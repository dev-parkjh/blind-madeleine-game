<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연출 에셋 에디터 - Blind Madeleine</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("../assets/fonts/PretendardJPVariable.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }

    :root {
      --bg: #12101a;
      --bg-panel: #1a1724;
      --bg-input: #0f0d14;
      --border: #2e2940;
      --text: #e8e4f0;
      --text-muted: #8a849c;
      --accent: #c9a86c;
      --accent-dim: #8a7348;
      --danger: #c96c7a;
      --success: #7ab88a;
      --radius: 8px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: "Consolas", "D2Coding", monospace;
      --control-height: 44px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    h1 {
      margin-right: auto;
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 700;
    }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 320px 1fr 340px;
    }

    @media (max-width: 980px) {
      html, body { height: auto; overflow: auto; }
      main { grid-template-columns: 1fr; }
      .panel { min-height: 280px; }
    }

    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .panel:last-child { border-right: none; border-left: 1px solid var(--border); }

    .right-panel {
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .right-panel .sidebar-section {
      flex-shrink: 0;
    }

    .right-panel .sidebar-section:last-child {
      flex: 0 0 auto;
      overflow: visible;
    }

    .panel-header {
      min-height: 48px;
      padding: 13px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .asset-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }

    .asset-card {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .asset-card:hover,
    .asset-card.active {
      border-color: var(--accent-dim);
      background: rgba(201, 168, 108, 0.10);
    }

    .kind-pill {
      min-width: 48px;
      height: 26px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(201, 168, 108, 0.13);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      text-align: center;
    }

    .asset-title { font-weight: 700; line-height: 1.3; }
    .asset-id { margin-top: 3px; color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; word-break: break-all; }
    .asset-path { grid-column: 1 / -1; color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; word-break: break-all; }
    .asset-scope {
      grid-column: 1 / -1;
      justify-self: start;
      max-width: 100%;
      padding: 2px 8px;
      border: 1px solid rgba(201, 168, 108, 0.28);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .empty-state {
      height: 100%;
      min-height: 360px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 14px; }
    .field.full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      min-height: var(--control-height);
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    textarea {
      min-height: 96px;
      padding: 12px;
      resize: vertical;
      line-height: 1.55;
    }

    textarea.mono {
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-dim); }

    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.tight { gap: 8px; }

    .filter-label {
      display: block;
      margin: 0 0 6px;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .filter-stack {
      display: grid;
      gap: 10px;
    }

    .chapter-checklist {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
    }

    .chapter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .chapter-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .chapter-option.missing {
      color: var(--danger);
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: var(--control-height);
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .checkbox-option input {
      width: 17px;
      height: 17px;
      min-height: 0;
      padding: 0;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .chapter-scope-hint {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .btn {
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--accent-dim); background: #1a1628; }
    .btn-primary { border-color: var(--accent); background: var(--accent-dim); color: #fff; }
    .btn-primary:hover { background: var(--accent); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: rgba(201, 108, 122, 0.15); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .status {
      padding: 5px 10px;
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .status.dirty { color: var(--accent); }
    .status.error { color: var(--danger); }

    .project-badge {
      padding: 4px 9px;
      border: 1px solid rgba(122, 184, 138, 0.35);
      border-radius: 999px;
      color: var(--success);
      background: rgba(122, 184, 138, 0.08);
      font-size: 0.72rem;
    }

    .preview {
      display: grid;
      gap: 12px;
    }

    .preview-box {
      min-height: 190px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      overflow: hidden;
      color: var(--text-muted);
      text-align: center;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      max-height: 240px;
      object-fit: contain;
      display: block;
    }

    .preview audio { width: 100%; }

    .validation-list {
      display: grid;
      gap: 8px;
      list-style: none;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .validation-list li {
      padding: 8px 10px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.035);
    }

    .validation-list li.error { color: #e8a0aa; background: rgba(201, 108, 122, 0.12); }
    .validation-list li.ok { color: var(--success); background: rgba(122, 184, 138, 0.10); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>연출 에셋 에디터</h1>
    <button class="btn" id="btnConnect">프로젝트 연결</button>
    <button class="btn btn-primary" id="btnNew">새 에셋</button>
    <button class="btn" id="btnSave" disabled>저장</button>
    <button class="btn btn-danger" id="btnDelete" disabled>삭제</button>
    <span class="project-badge hidden" id="projectBadge"></span>
    <span class="status" id="status">프로젝트를 연결하세요.</span>
  </header>

  <main>
    <aside class="panel">
      <div class="panel-header">에셋 목록</div>
      <div class="sidebar-section filter-stack">
        <div>
          <label class="filter-label" for="kindFilter">종류 필터</label>
          <select id="kindFilter">
            <option value="">전체</option>
            <option value="bgm">BGM</option>
            <option value="sfx">SFX</option>
            <option value="background">배경 이미지</option>
          </select>
        </div>
        <div>
          <label class="filter-label" for="chapterFilter">챕터 필터</label>
          <select id="chapterFilter" disabled>
            <option value="">전체 챕터</option>
          </select>
          <p class="chapter-scope-hint">챕터가 비어 있는 에셋은 모든 챕터에 표시됩니다.</p>
        </div>
      </div>
      <div class="asset-list" id="assetList"></div>
    </aside>

    <section class="panel" style="border-right:none;">
      <div class="editor">
        <div class="empty-state" id="emptyState">
          <p><strong>Blind Madeleine</strong> 연출 에셋을 관리합니다.<br><br>
          BGM, 효과음, 배경 이미지를 등록한 뒤<br>
          대사 에디터 우클릭 메뉴에서 선택해 삽입하세요.</p>
        </div>
        <div id="editorForm" class="hidden">
          <div class="form-grid">
            <div class="field">
              <label>에셋 ID</label>
              <input id="fieldId" placeholder="자동 생성" readonly>
            </div>
            <div class="field">
              <label>종류</label>
              <select id="fieldKind">
                <option value="bgm">BGM</option>
                <option value="sfx">SFX</option>
                <option value="background">배경 이미지</option>
              </select>
            </div>
            <div class="field full">
              <label>표시명</label>
              <input id="fieldDisplayName" placeholder="빗소리 루프">
            </div>
            <div class="field full">
              <label>설명</label>
              <textarea id="fieldDescription" placeholder="어디서 쓰는 에셋인지 적어두세요."></textarea>
            </div>
            <div class="field full">
              <label>사용 챕터 <span style="font-weight:400;opacity:0.7;">(선택 없으면 전 챕터 공용)</span></label>
              <div class="chapter-checklist" id="fieldChapters"></div>
              <p class="chapter-scope-hint">대사 에디터의 에셋 선택 팝업도 이 챕터 범위를 기준으로 좁혀집니다.</p>
            </div>
            <div class="field full">
              <label>파일 경로</label>
              <div class="row tight">
                <input id="fieldPath" style="flex:1 1 340px;" placeholder="res://assets/story_assets/bgm/5f0c4ce3-1a42-420c-9027-f60d729d4fe5.ogg">
                <button type="button" class="btn" id="btnPickFile">파일 등록</button>
              </div>
            </div>
            <div class="field">
              <label>볼륨 (0-1)</label>
              <input id="fieldVolume" type="number" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="field" id="fieldBackgroundFixedWrap">
              <label>배경 동작</label>
              <label class="checkbox-option" for="fieldBackgroundFixed">
                <input id="fieldBackgroundFixed" type="checkbox">
                <span>고정</span>
              </label>
              <p class="chapter-scope-hint">체크하면 게임 화면에서 화자 위치 패럴렉스를 적용하지 않습니다.</p>
            </div>
            <div class="field">
              <label>루프</label>
              <select id="fieldLoop">
                <option value="true">켜짐</option>
                <option value="false">꺼짐</option>
              </select>
            </div>
            <div class="field full">
              <label>메타데이터 JSON</label>
              <textarea class="mono" id="fieldMetadata">{}</textarea>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel right-panel">
      <div class="panel-header">미리보기</div>
      <div class="sidebar-section preview">
        <div class="preview-box" id="previewBox">에셋 없음</div>
        <audio id="audioPreview" controls preload="metadata" class="hidden"></audio>
      </div>
      <div class="panel-header">검증</div>
      <div class="sidebar-section">
        <ul class="validation-list" id="validationList"></ul>
      </div>
    </aside>
  </main>

  <input type="file" id="assetFileInput" hidden>

  <script>
    const DB_NAME = "blind-madeleine-dialogue-editor";
    const STORE_NAME = "settings";
    const HANDLE_KEY = "projectHandle";
    const STORY_ASSET_DIR = "data/story_assets";
    const STORY_MEDIA_DIR = "assets/story_assets";
    const CHAPTER_DIR = "data/chapters";
    const KIND_LABELS = {
      bgm: "BGM",
      sfx: "SFX",
      background: "배경",
    };
    const KIND_ACCEPT = {
      bgm: "audio/*",
      sfx: "audio/*",
      background: "image/png,image/jpeg,image/webp,image/gif",
    };

    const DEFAULT_ASSET = {
      id: "",
      kind: "sfx",
      display_name: "",
      description: "",
      path: "",
      chapters: [],
      volume: 1,
      loop: false,
      fixed: false,
      metadata: {},
      filename: "",
      sourceFilename: "",
    };

    let state = {
      assets: [],
      asset: { ...DEFAULT_ASSET },
      chapters: [],
      chapterFilter: "",
      selectedIndex: -1,
      dirty: false,
      previewObjectUrl: "",
    };

    let project = {
      mode: "none",
      rootHandle: null,
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, "&#39;");
    }

    function sanitizeSegment(value, fallback = "asset") {
      const safe = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_-]+/g, "_")
        .replace(/^_+|_+$/g, "");
      return safe || fallback;
    }

    function normalizeIdList(value) {
      const source = Array.isArray(value)
        ? value
        : (typeof value === "string" ? [value] : []);
      const ids = [];
      const seen = new Set();
      source.forEach((raw) => {
        const id = String(raw || "").trim();
        if (!id || seen.has(id)) return;
        seen.add(id);
        ids.push(id);
      });
      return ids;
    }

    function getChapterIdsFromData(data = {}) {
      const metadata = data.metadata && typeof data.metadata === "object" ? data.metadata : {};
      return normalizeIdList(data.chapters || data.chapter_ids || metadata.chapters || metadata.chapter_ids);
    }

    function chapterLabel(chapter) {
      return String(chapter?.title || chapter?.name || chapter?.display_name || chapter?.id || "").trim();
    }

    function getChapterLabel(id) {
      const chapter = state.chapters.find((entry) => entry.id === id);
      return chapterLabel(chapter) || id;
    }

    function getChapterScopeLabel(chapterIds) {
      const ids = normalizeIdList(chapterIds);
      if (ids.length === 0) return "전 챕터";
      return ids.map(getChapterLabel).join(", ");
    }

    function isAvailableForChapter(entry, chapterId = state.chapterFilter) {
      const filter = String(chapterId || "").trim();
      if (!filter) return true;
      const ids = normalizeIdList(entry?.chapters || []);
      return ids.length === 0 || ids.includes(filter);
    }

    function makeUuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return "asset-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function cloneAsset(asset) {
      return JSON.parse(JSON.stringify(asset || DEFAULT_ASSET));
    }

    function revokePreviewObjectUrl() {
      if (state.previewObjectUrl) {
        URL.revokeObjectURL(state.previewObjectUrl);
        state.previewObjectUrl = "";
      }
    }

    async function getSavedProjectHandle() {
      if (!("indexedDB" in window)) return null;
      return new Promise((resolve) => {
        const open = indexedDB.open(DB_NAME, 1);
        open.onupgradeneeded = () => open.result.createObjectStore(STORE_NAME);
        open.onerror = () => resolve(null);
        open.onsuccess = () => {
          const tx = open.result.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        };
      });
    }

    async function saveProjectHandle(handle) {
      if (!("indexedDB" in window)) return;
      return new Promise((resolve) => {
        const open = indexedDB.open(DB_NAME, 1);
        open.onupgradeneeded = () => open.result.createObjectStore(STORE_NAME);
        open.onerror = () => resolve();
        open.onsuccess = () => {
          const tx = open.result.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        };
      });
    }

    async function readTextFromProject(relativePath) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativePath.split("/");
        let dir = project.rootHandle;
        for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i]);
        const file = await (await dir.getFileHandle(parts[parts.length - 1])).getFile();
        return file.text();
      }

      throw new Error("프로젝트가 연결되지 않았습니다.");
    }

    async function readBinaryFromProject(relativePath) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativePath.split("/");
        let dir = project.rootHandle;
        for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i]);
        const file = await (await dir.getFileHandle(parts[parts.length - 1])).getFile();
        return file.arrayBuffer();
      }

      throw new Error("프로젝트가 연결되지 않았습니다.");
    }

    async function writeTextToProject(relativePath, text) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativePath.split("/");
        let dir = project.rootHandle;
        for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i], { create: true });
        const writable = await (await dir.getFileHandle(parts[parts.length - 1], { create: true })).createWritable();
        await writable.write(text);
        await writable.close();
        return "fs";
      }

      throw new Error("프로젝트가 연결되지 않았습니다.");
    }

    async function writeBinaryToProject(relativePath, file) {
      if (project.mode !== "fs" || !project.rootHandle) {
        throw new Error("파일 등록은 폴더 연결 모드에서만 지원합니다.");
      }

      const parts = relativePath.split("/");
      let dir = project.rootHandle;
      for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i], { create: true });
      const writable = await (await dir.getFileHandle(parts[parts.length - 1], { create: true })).createWritable();
      await writable.write(file);
      await writable.close();
    }

    async function deleteFileFromProject(relativePath) {
      if (project.mode !== "fs" || !project.rootHandle) {
        throw new Error("삭제는 폴더 연결 모드에서만 지원합니다.");
      }
      const parts = relativePath.split("/");
      let dir = project.rootHandle;
      for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i]);
      await dir.removeEntry(parts[parts.length - 1]);
    }

    async function listJsonFiles(relativeDir) {
      if (project.mode === "fs" && project.rootHandle) {
        let dir = project.rootHandle;
        try {
          for (const part of relativeDir.split("/")) dir = await dir.getDirectoryHandle(part);
        } catch {
          return [];
        }
        const names = [];
        for await (const entry of dir.values()) {
          if (entry.kind === "file" && entry.name.toLowerCase().endsWith(".json")) names.push(entry.name);
        }
        return names.sort();
      }

      return [];
    }

    function normalizeKind(kind) {
      const clean = String(kind || "").trim().toLowerCase();
      if (["bgm", "music", "background_music"].includes(clean)) return "bgm";
      if (["bg", "image", "background", "background_image"].includes(clean)) return "background";
      return "sfx";
    }

    function normalizeAsset(data, filename = "") {
      const id = String(data.id || filename.replace(/\.json$/i, "") || "").trim();
      const kind = normalizeKind(data.kind || "sfx");
      const metadata = data.metadata && typeof data.metadata === "object" ? data.metadata : {};
      return {
        id,
        kind,
        display_name: String(data.display_name || data.name || id).trim(),
        description: String(data.description || ""),
        path: String(data.path || ""),
        chapters: getChapterIdsFromData(data),
        volume: Number(data.volume ?? 1) || 0,
        loop: Boolean(data.loop ?? kind === "bgm"),
        fixed: Boolean(data.fixed ?? data.background_fixed ?? metadata.fixed ?? false),
        metadata,
        filename: String(data.filename || filename || `${id}.json`),
        sourceFilename: filename,
      };
    }

    async function loadAssets() {
      const names = await listJsonFiles(STORY_ASSET_DIR);
      const loaded = [];
      for (const name of names) {
        try {
          const data = JSON.parse(await readTextFromProject(`${STORY_ASSET_DIR}/${name}`));
          loaded.push(normalizeAsset(data, name));
        } catch (err) {
          console.warn("에셋 로드 실패:", name, err);
        }
      }
      state.assets = loaded.sort((a, b) =>
        `${a.kind}:${a.display_name || a.id}`.localeCompare(`${b.kind}:${b.display_name || b.id}`)
      );
      if (state.selectedIndex >= state.assets.length) state.selectedIndex = -1;
      renderAssetList();
      renderValidation();
    }

    async function loadChaptersFromProject() {
      let names = [];
      try {
        names = await listJsonFiles(CHAPTER_DIR);
      } catch {
        names = [];
      }

      const loaded = [];
      for (const name of names) {
        try {
          const data = JSON.parse(await readTextFromProject(`${CHAPTER_DIR}/${name}`));
          const id = String(data.id || name.replace(/\.json$/i, "")).trim();
          if (!id) continue;
          loaded.push({
            id,
            title: String(data.title || data.name || data.display_name || id).trim(),
            order: Number(data.order ?? 0) || 0,
          });
        } catch (err) {
          console.warn("챕터 로드 실패:", name, err);
        }
      }

      state.chapters = loaded.sort((a, b) =>
        (a.order - b.order) || chapterLabel(a).localeCompare(chapterLabel(b))
      );
      renderChapterFilter();
      renderChapterChecklist(state.asset.chapters || []);
    }

    function renderChapterFilter() {
      const select = $("chapterFilter");
      if (!select) return;
      const current = state.chapterFilter;
      select.innerHTML = `<option value="">전체 챕터</option>` + state.chapters.map((chapter) =>
        `<option value="${escapeAttr(chapter.id)}">${escapeHtml(chapterLabel(chapter) || chapter.id)}</option>`
      ).join("");
      select.disabled = state.chapters.length === 0;
      select.value = state.chapters.some((chapter) => chapter.id === current) ? current : "";
      state.chapterFilter = select.value;
    }

    function saveCurrentFromForm() {
      if (!$("editorForm") || $("editorForm").classList.contains("hidden")) return;
      state.asset.id = $("fieldId").value.trim() || makeUuid();
      state.asset.kind = normalizeKind($("fieldKind").value);
      state.asset.display_name = $("fieldDisplayName").value.trim();
      state.asset.description = $("fieldDescription").value;
      state.asset.path = $("fieldPath").value.trim();
      state.asset.chapters = [...document.querySelectorAll("[data-asset-chapter]:checked")]
        .map((checkbox) => checkbox.value);
      state.asset.volume = Math.max(0, Math.min(1, Number($("fieldVolume").value) || 0));
      state.asset.loop = normalizeKind(state.asset.kind) === "bgm";
      state.asset.fixed = normalizeKind(state.asset.kind) === "background" && Boolean($("fieldBackgroundFixed")?.checked);
      state.asset.filename = (state.asset.filename || state.asset.id || "asset").replace(/\.json$/i, "");
      try {
        state.asset.metadata = JSON.parse($("fieldMetadata").value || "{}");
        $("fieldMetadata").style.borderColor = "";
      } catch {
        $("fieldMetadata").style.borderColor = "var(--danger)";
      }
    }

    function buildExportObject(asset = state.asset) {
      const out = {
        id: String(asset.id || "").trim(),
        kind: normalizeKind(asset.kind),
        display_name: String(asset.display_name || asset.id || "").trim(),
        description: String(asset.description || ""),
        path: String(asset.path || "").trim(),
        metadata: asset.metadata || {},
      };
      const chapters = normalizeIdList(asset.chapters || []);
      if (chapters.length > 0) out.chapters = chapters;
      if (out.kind !== "background") {
        out.volume = Math.max(0, Math.min(1, Number(asset.volume ?? 1) || 0));
      } else {
        out.fixed = Boolean(asset.fixed);
      }
      return out;
    }

    function markDirty() {
      state.dirty = true;
      $("status").textContent = `${state.asset.display_name || state.asset.id || "새 에셋"} · 저장되지 않은 변경사항`;
      $("status").className = "status dirty";
      $("btnSave").disabled = false;
      renderValidation();
      renderAssetList();
      renderPreview();
    }

    function markClean(message = "저장됨") {
      state.dirty = false;
      $("status").textContent = message;
      $("status").className = "status";
      $("btnSave").disabled = false;
    }

    function renderAssetList() {
      const list = $("assetList");
      const filter = $("kindFilter").value;
      const assets = state.assets
        .map((asset, index) => ({ asset, index }))
        .filter(({ asset }) => (!filter || asset.kind === filter) && isAvailableForChapter(asset));

      if (assets.length === 0) {
        list.innerHTML = `<p style="padding:12px;color:var(--text-muted);font-size:0.82rem;">조건에 맞는 에셋이 없습니다.</p>`;
        return;
      }

      list.innerHTML = assets.map(({ asset, index }) => `
        <button type="button" class="asset-card${index === state.selectedIndex ? " active" : ""}" data-index="${index}">
          <span class="kind-pill">${escapeHtml(KIND_LABELS[asset.kind] || asset.kind)}</span>
          <span>
            <span class="asset-title">${escapeHtml(asset.display_name || asset.id || "(이름 없음)")}</span>
            <span class="asset-id">${escapeHtml(asset.id || "")}</span>
          </span>
          <span class="asset-path">${escapeHtml(asset.path || "경로 없음")}</span>
          <span class="asset-scope">${escapeHtml(getChapterScopeLabel(asset.chapters || []))}</span>
        </button>
      `).join("");

      list.querySelectorAll("[data-index]").forEach((button) => {
        button.addEventListener("click", () => selectAsset(Number(button.dataset.index)));
      });
    }

    function renderForm() {
      const hasAsset = state.selectedIndex >= 0 || state.asset.id || state.dirty;
      $("emptyState").classList.toggle("hidden", hasAsset);
      $("editorForm").classList.toggle("hidden", !hasAsset);
      $("btnDelete").disabled = state.selectedIndex < 0;
      if (!hasAsset) return;

      $("fieldId").value = state.asset.id || "";
      $("fieldKind").value = normalizeKind(state.asset.kind);
      $("fieldDisplayName").value = state.asset.display_name || "";
      $("fieldDescription").value = state.asset.description || "";
      $("fieldPath").value = state.asset.path || "";
      renderChapterChecklist(state.asset.chapters || []);
      $("fieldVolume").value = Number(state.asset.volume ?? 1);
      $("fieldLoop").value = String(Boolean(state.asset.loop));
      $("fieldBackgroundFixed").checked = Boolean(state.asset.fixed);
      $("fieldMetadata").value = JSON.stringify(state.asset.metadata || {}, null, 2);

      const isBackground = normalizeKind(state.asset.kind) === "background";
      $("fieldVolume").closest(".field").classList.toggle("hidden", isBackground);
      $("fieldBackgroundFixedWrap").classList.toggle("hidden", !isBackground);
      $("fieldLoop").closest(".field").classList.toggle("hidden", true);
      $("assetFileInput").accept = KIND_ACCEPT[normalizeKind(state.asset.kind)] || "";
      renderPreview();
    }

    function renderChapterChecklist(selectedChapters = []) {
      const container = $("fieldChapters");
      if (!container) return;

      const selected = new Set(normalizeIdList(selectedChapters));
      const known = new Set(state.chapters.map((chapter) => chapter.id));
      const missing = [...selected].filter((id) => !known.has(id));
      const rows = [
        ...state.chapters.map((chapter) => ({
          id: chapter.id,
          label: chapterLabel(chapter),
          missing: false,
        })),
        ...missing.map((id) => ({ id, label: id, missing: true })),
      ];

      if (rows.length === 0) {
        container.innerHTML = `<div class="chapter-scope-hint">등록된 챕터가 없습니다. 챕터를 만들면 여기서 선택할 수 있습니다.</div>`;
        return;
      }

      container.innerHTML = rows.map((chapter) => `
        <label class="chapter-option${chapter.missing ? " missing" : ""}">
          <input type="checkbox" data-asset-chapter value="${escapeAttr(chapter.id)}" ${selected.has(chapter.id) ? "checked" : ""}>
          <span>${escapeHtml(chapter.label || chapter.id)}${chapter.missing ? " · 없음" : ""}</span>
        </label>
      `).join("");

      container.querySelectorAll("[data-asset-chapter]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          saveCurrentFromForm();
          markDirty();
        });
      });
    }

    async function renderPreview() {
      revokePreviewObjectUrl();
      const box = $("previewBox");
      const audio = $("audioPreview");
      audio.classList.add("hidden");
      audio.removeAttribute("src");
      audio.load();
      box.textContent = "에셋 없음";

      const path = String(state.asset.path || "").replace(/^res:\/\//, "");
      if (!path || project.mode === "none") return;

      try {
        const buffer = await readBinaryFromProject(path);
        const kind = normalizeKind(state.asset.kind);
        const ext = path.split(".").pop()?.toLowerCase() || "";
        const mime = kind === "background"
          ? ({ png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif" }[ext] || "image/png")
          : ({ mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", opus: "audio/ogg", m4a: "audio/mp4", aac: "audio/aac", flac: "audio/flac", webm: "audio/webm" }[ext] || "audio/mpeg");
        state.previewObjectUrl = URL.createObjectURL(new Blob([buffer], { type: mime }));
        if (kind === "background") {
          box.innerHTML = `<img src="${state.previewObjectUrl}" alt="">`;
        } else {
          box.textContent = `${KIND_LABELS[kind]} 미리듣기`;
          audio.src = state.previewObjectUrl;
          audio.classList.remove("hidden");
          audio.load();
        }
      } catch {
        box.textContent = "미리보기를 불러올 수 없습니다.";
      }
    }

    function renderValidation() {
      const list = $("validationList");
      const errors = [];
      const asset = state.asset || {};
      if (!$("editorForm")?.classList.contains("hidden")) {
        if (!String(asset.id || "").trim()) errors.push("에셋 ID가 필요합니다.");
        if (!String(asset.display_name || "").trim()) errors.push("표시명이 필요합니다.");
        if (!String(asset.path || "").trim()) errors.push("파일 경로가 필요합니다.");
        if (String(asset.path || "").trim() && !String(asset.path || "").startsWith("res://")) {
          errors.push("파일 경로는 res:// 로 시작해야 합니다.");
        }
      }
      list.innerHTML = errors.length
        ? errors.map((error) => `<li class="error">${escapeHtml(error)}</li>`).join("")
        : `<li class="ok">문제 없음</li>`;
      return errors;
    }

    function selectAsset(index) {
      saveCurrentFromForm();
      state.selectedIndex = index;
      state.asset = cloneAsset(state.assets[index]);
      state.dirty = false;
      renderAssetList();
      renderForm();
      markClean(`열림: ${state.asset.display_name || state.asset.id}`);
    }

    function newAsset() {
      const kind = $("kindFilter").value || "sfx";
      const id = makeUuid();
      state.selectedIndex = -1;
      state.asset = {
        ...cloneAsset(DEFAULT_ASSET),
        id,
        kind,
        chapters: state.chapterFilter ? [state.chapterFilter] : [],
        loop: kind === "bgm",
        filename: `${id}.json`,
      };
      state.dirty = true;
      renderAssetList();
      renderForm();
      markDirty();
      $("fieldDisplayName").focus();
    }

    function getAssetExtension(file, kind) {
      const byMime = {
        "audio/mpeg": "mp3",
        "audio/wav": "wav",
        "audio/ogg": "ogg",
        "audio/mp4": "m4a",
        "audio/aac": "aac",
        "audio/flac": "flac",
        "audio/webm": "webm",
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp",
        "image/gif": "gif",
      };
      if (file.type && byMime[file.type]) return byMime[file.type];
      const ext = (file.name || "").split(".").pop()?.toLowerCase();
      const allowedAudio = ["mp3", "wav", "ogg", "opus", "m4a", "aac", "flac", "webm"];
      const allowedImage = ["png", "jpg", "jpeg", "webp", "gif"];
      if (kind === "background" && allowedImage.includes(ext)) return ext === "jpeg" ? "jpg" : ext;
      if (kind !== "background" && allowedAudio.includes(ext)) return ext;
      return kind === "background" ? "png" : "ogg";
    }

    async function registerAssetFile(file) {
      saveCurrentFromForm();
      const kind = normalizeKind(state.asset.kind);
      if (!state.asset.id) {
        state.asset.id = makeUuid();
      }
      if (!state.asset.display_name) {
        state.asset.display_name = file.name.replace(/\.[^.]+$/, "");
      }
      const id = sanitizeSegment(state.asset.id, "asset");
      const ext = getAssetExtension(file, kind);
      const relativePath = `${STORY_MEDIA_DIR}/${kind}/${id}.${ext}`;
      await writeBinaryToProject(relativePath, file);
      state.asset.path = `res://${relativePath}`;
      if (kind === "bgm") state.asset.loop = true;
      markDirty();
      renderForm();
    }

    async function saveAsset() {
      saveCurrentFromForm();
      if (renderValidation().length > 0) return;

      const exportObject = buildExportObject();
      const filename = `${sanitizeSegment(exportObject.id, "asset")}.json`;
      const oldFilename = state.asset.sourceFilename;
      const content = JSON.stringify(exportObject, null, 2) + "\n";
      await writeTextToProject(`${STORY_ASSET_DIR}/${filename}`, content);
      if (oldFilename && oldFilename !== filename && project.mode === "fs") {
        try { await deleteFileFromProject(`${STORY_ASSET_DIR}/${oldFilename}`); } catch {}
      }
      state.asset = normalizeAsset(exportObject, filename);
      await loadAssets();
      const index = state.assets.findIndex((asset) => asset.id === exportObject.id);
      if (index >= 0) selectAsset(index);
      markClean(`저장됨: ${filename}`);
    }

    async function deleteCurrentAsset() {
      if (state.selectedIndex < 0) return;
      const asset = state.assets[state.selectedIndex];
      if (!confirm(`'${asset.display_name || asset.id}' 에셋을 삭제할까요?`)) return;
      await deleteFileFromProject(`${STORY_ASSET_DIR}/${asset.sourceFilename || asset.filename}`);
      state.selectedIndex = -1;
      state.asset = cloneAsset(DEFAULT_ASSET);
      await loadAssets();
      renderForm();
      markClean("삭제됨");
    }

    function updateProjectBadge(label) {
      $("projectBadge").textContent = label;
      $("projectBadge").classList.remove("hidden");
    }

    async function connectProjectViaFs(rootHandle) {
      project.mode = "fs";
      project.rootHandle = rootHandle;
      await saveProjectHandle(rootHandle);
      await loadChaptersFromProject();
      await loadAssets();
      updateProjectBadge(`폴더 · ${rootHandle.name}`);
      $("status").textContent = "프로젝트 연결됨";
      $("status").className = "status";
    }

    async function requestProjectConnection() {
      if (!window.showDirectoryPicker) {
        throw new Error("폴더 연결을 지원하는 브라우저가 필요합니다.");
      }
      const handle = await window.showDirectoryPicker({ mode: "readwrite" });
      await connectProjectViaFs(handle);
    }

    function bindEvents() {
      $("btnConnect").addEventListener("click", async () => {
        try { await requestProjectConnection(); }
        catch (err) {
          $("status").textContent = `연결 실패: ${err.message}`;
          $("status").className = "status error";
        }
      });
      $("btnNew").addEventListener("click", newAsset);
      $("btnSave").addEventListener("click", () => saveAsset().catch((err) => alert(err.message)));
      $("btnDelete").addEventListener("click", () => deleteCurrentAsset().catch((err) => alert(err.message)));
      $("btnPickFile").addEventListener("click", () => {
        $("assetFileInput").accept = KIND_ACCEPT[normalizeKind(state.asset.kind)] || "";
        $("assetFileInput").click();
      });
      $("assetFileInput").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        try { await registerAssetFile(file); }
        catch (err) { alert(err.message); }
      });
      $("kindFilter").addEventListener("change", renderAssetList);
      $("chapterFilter").addEventListener("change", () => {
        state.chapterFilter = $("chapterFilter").value;
        renderAssetList();
      });
      ["fieldId", "fieldKind", "fieldDisplayName", "fieldDescription", "fieldPath", "fieldVolume", "fieldLoop", "fieldBackgroundFixed", "fieldMetadata"].forEach((id) => {
        $(id).addEventListener("input", () => {
          saveCurrentFromForm();
          markDirty();
          if (id === "fieldKind") renderForm();
        });
        $(id).addEventListener("change", () => {
          saveCurrentFromForm();
          markDirty();
          if (id === "fieldKind") renderForm();
        });
      });
    }

    async function init() {
      bindEvents();
      const handle = await getSavedProjectHandle();
      if (handle) {
        try {
          if (!handle.queryPermission || await handle.queryPermission({ mode: "readwrite" }) === "granted") {
            await connectProjectViaFs(handle);
          }
        } catch {
          // Manual connection remains available.
        }
      }
      renderAssetList();
      renderForm();
      renderValidation();
    }

    init();
  </script>
</body>
</html>
