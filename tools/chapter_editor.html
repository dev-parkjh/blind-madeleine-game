	    function renderCanvasTransform({ preserveViewport = true } = {}) {
      const scroll = $("canvasScroll");
      const previousOffsetX = state.world.offsetX;
      const previousOffsetY = state.world.offsetY;
      updateWorldFromRoi();
      const svg = $("connectionSvg");
      $("canvasWorld").style.width = `${state.world.width * state.zoom}px`;
      $("canvasWorld").style.height = `${state.world.height * state.zoom}px`;
      $("canvasContent").style.width = `${state.world.width}px`;
      $("canvasContent").style.height = `${state.world.height}px`;
      $("canvasContent").style.transform = `scale(${state.zoom})`;
      svg.setAttribute("viewBox", `0 0 ${state.world.width} ${state.world.height}`);
      svg.style.width = `${state.world.width}px`;
      svg.style.height = `${state.world.height}px`;
      $("zoomLabel").textContent = `${Math.round(state.zoom * 100)}%`;
      if (preserveViewport && scroll) {
        scroll.scrollLeft += (state.world.offsetX - previousOffsetX) * state.zoom;
        scroll.scrollTop += (state.world.offsetY - previousOffsetY) * state.zoom;
      }
      scheduleConnectionRender();
    }

    function renderAll() {
      renderCanvasTransform();
      renderChapterSelect();
      renderChapterEditor();
      renderDialogueList();
	      renderNodes();
	      renderInspector();
	      renderValidation();
	      updateDialogueEditorShortcut();
	      $("btnClearSelected").disabled = !(state.selectedEdgeFrom || (state.selectedId && state.byId.get(state.selectedId)?.next));
      $("btnRemoveSelected").disabled = !(state.selectedId && isDialogueInSelectedChapter(state.selectedId));
    }

    function setZoom(nextZoom) {
      state.zoom = clamp(Math.round(nextZoom * 20) / 20, MIN_ZOOM, MAX_ZOOM);
      $("zoomRange").value = String(Math.round(state.zoom * 100));
      renderCanvasTransform();
    }

    function centerCanvasOnBounds(bounds, smooth = false) {
      if (!bounds) return;
      const scroll = $("canvasScroll");
      const centerX = (bounds.centerX + state.world.offsetX) * state.zoom;
      const centerY = (bounds.centerY + state.world.offsetY) * state.zoom;
      const left = Math.max(0, centerX - scroll.clientWidth * 0.5);
      const top = Math.max(0, centerY - scroll.clientHeight * 0.5);
      if (smooth) {
        scroll.scrollTo({ left, top, behavior: "smooth" });
        return;
      }
      scroll.scrollLeft = left;
      scroll.scrollTop = top;
    }

    function fitCanvasToRoi(smooth = false) {
      const bounds = getPlacedDialogueBounds();
      if (!bounds) return;
      const scroll = $("canvasScroll");
      const availableWidth = Math.max(240, scroll.clientWidth - ROI_FIT_MARGIN_PX);
      const availableHeight = Math.max(180, scroll.clientHeight - ROI_FIT_MARGIN_PX);
      const widthZoom = availableWidth / Math.max(bounds.width, NODE_WIDTH);
      const heightZoom = availableHeight / Math.max(bounds.height, NODE_MIN_HEIGHT);
      setZoom(Math.min(widthZoom, heightZoom, FIT_MAX_ZOOM));
      centerCanvasOnBounds(bounds, smooth);
    }

    function focusDialogue(id) {
      const dialogue = state.byId.get(id);
      if (!dialogue) return;
      if (state.filter && dialogue.chapterKey !== state.filter) {
        state.filter = "";
        $("chapterFilter").value = "";
      }
      state.search = "";
      $("dialogueSearch").value = "";
      state.selectedId = id;
      state.selectedEdgeFrom = "";
      renderAll();
      if (!isDialogueInSelectedChapter(dialogue.id)) return;

      requestAnimationFrame(() => {
        centerCanvasOnBounds({
          centerX: dialogue.x + NODE_WIDTH * 0.5,
          centerY: dialogue.y + NODE_MIN_HEIGHT * 0.5,
        }, true);
      });
    }

    function autoLayoutDialogues(markAsDirty = true) {
      const visible = getCanvasDialogues();
      const incoming = new Map();
      visible.forEach((dialogue) => incoming.set(dialogue.id, 0));
      visible.forEach((dialogue) => {
        if (incoming.has(dialogue.next)) incoming.set(dialogue.next, incoming.get(dialogue.next) + 1);
      });

      const roots = visible.filter((dialogue) => (incoming.get(dialogue.id) || 0) === 0);
      const ordered = [];
      const seen = new Set();
      const walk = (dialogue, depth = 0) => {
        if (!dialogue || seen.has(dialogue.id)) return;
        seen.add(dialogue.id);
        ordered.push({ dialogue, depth });
        const next = state.byId.get(dialogue.next);
        if (next && getChapterDialogueIdSet().has(next.id)) walk(next, depth + 1);
      };
      roots.forEach((dialogue) => walk(dialogue, 0));
      visible.forEach((dialogue) => walk(dialogue, 0));

      const rowsByDepth = new Map();
      ordered.forEach(({ dialogue, depth }) => {
        const row = rowsByDepth.get(depth) || 0;
        rowsByDepth.set(depth, row + 1);
        setPosition(dialogue, 120 + depth * GRID_X, 100 + row * GRID_Y, markAsDirty);
      });

      renderAll();
    }

    function applyInitialLayout() {
      const selectedIds = getChapterDialogueIdSet();
      const missing = state.dialogues.filter((dialogue) => selectedIds.has(dialogue.id) && !dialogue.hasSavedPosition);
      if (missing.length === 0) return;
      const originalFilter = state.filter;
      const originalSearch = state.search;
      state.filter = "";
      state.search = "";

      const incoming = new Map();
      state.dialogues.filter((dialogue) => selectedIds.has(dialogue.id)).forEach((dialogue) => incoming.set(dialogue.id, 0));
      state.dialogues.forEach((dialogue) => {
        if (incoming.has(dialogue.next)) incoming.set(dialogue.next, incoming.get(dialogue.next) + 1);
      });

      const roots = state.dialogues.filter((dialogue) => selectedIds.has(dialogue.id) && (incoming.get(dialogue.id) || 0) === 0);
      const ordered = [];
      const seen = new Set();
      const walk = (dialogue, depth = 0) => {
        if (!dialogue || seen.has(dialogue.id)) return;
        seen.add(dialogue.id);
        ordered.push({ dialogue, depth });
        const next = state.byId.get(dialogue.next);
        if (next && selectedIds.has(next.id)) walk(next, depth + 1);
      };
      roots.forEach((dialogue) => walk(dialogue, 0));
      state.dialogues.filter((dialogue) => selectedIds.has(dialogue.id)).forEach((dialogue) => walk(dialogue, 0));

      const rowsByDepth = new Map();
      ordered.forEach(({ dialogue, depth }) => {
        const row = rowsByDepth.get(depth) || 0;
        rowsByDepth.set(depth, row + 1);
        if (dialogue.hasSavedPosition) return;
        setPosition(dialogue, 120 + depth * GRID_X, 100 + row * GRID_Y, false);
      });

      state.filter = originalFilter;
      state.search = originalSearch;
    }

    function onNodePointerDown(event) {
      if (event.button !== 0) return;
      if (event.target.closest(".port")) return;
      const node = event.currentTarget;
      const dialogue = state.byId.get(node.dataset.id || "");
      if (!dialogue) return;

      state.selectedId = dialogue.id;
      state.selectedEdgeFrom = "";
      renderInspector();
      renderDialogueList();

      const start = clientToWorld(event.clientX, event.clientY);
      state.dragging = {
        id: dialogue.id,
        startX: start.x,
        startY: start.y,
        originalX: dialogue.x,
        originalY: dialogue.y,
      };
      node.classList.add("dragging");
      node.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function onPortOutPointerDown(event) {
      if (event.button !== 0) return;
      event.stopPropagation();
      const node = event.target.closest(".dialogue-node");
      if (!node) return;
      const sourceId = node.dataset.id || "";
      state.connecting = { sourceId };
      state.selectedId = sourceId;
      state.selectedEdgeFrom = "";
      updatePreviewConnection(event.clientX, event.clientY);
      event.target.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function onCanvasPointerDown(event) {
      if (event.button !== 1) return;
      const scroll = $("canvasScroll");
      state.panning = {
        startX: event.clientX,
        startY: event.clientY,
        scrollLeft: scroll.scrollLeft,
        scrollTop: scroll.scrollTop,
      };
      scroll.classList.add("panning");
      scroll.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function getDraggedDialogueId(event) {
      return state.listDraggingId
        || event.dataTransfer.getData("application/x-blind-madeleine-dialogue-id")
        || event.dataTransfer.getData("text/plain");
    }

    function onCanvasDragOver(event) {
      const id = getDraggedDialogueId(event);
      if (!id || !state.byId.has(id)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      $("canvasScroll").classList.add("drop-target");
    }

    function onCanvasDragLeave(event) {
      if ($("canvasScroll").contains(event.relatedTarget)) return;
      $("canvasScroll").classList.remove("drop-target");
    }

    function onCanvasDrop(event) {
      const id = getDraggedDialogueId(event);
      if (!id || !state.byId.has(id)) return;
      event.preventDefault();
      $("canvasScroll").classList.remove("drop-target");
      state.listDraggingId = "";
      const point = clientToWorld(event.clientX, event.clientY);
      placeDialogueOnCanvas(id, point.x - NODE_WIDTH * 0.5, point.y - NODE_MIN_HEIGHT * 0.5);
    }

    function onDocumentPointerMove(event) {
      if (state.panning) {
        const scroll = $("canvasScroll");
        scroll.scrollLeft = state.panning.scrollLeft - (event.clientX - state.panning.startX);
        scroll.scrollTop = state.panning.scrollTop - (event.clientY - state.panning.startY);
        event.preventDefault();
        return;
      }

      if (state.connecting) {
        updatePreviewConnection(event.clientX, event.clientY);
        return;
      }

      if (!state.dragging) return;
      const dialogue = state.byId.get(state.dragging.id);
      if (!dialogue) return;
      const current = clientToWorld(event.clientX, event.clientY);
      const nextX = state.dragging.originalX + current.x - state.dragging.startX;
      const nextY = state.dragging.originalY + current.y - state.dragging.startY;
      setPosition(dialogue, nextX, nextY, true);

      const el = document.querySelector(`.dialogue-node[data-id="${CSS.escape(dialogue.id)}"]`);
      if (el) {
        el.style.left = `${dialogue.x + state.world.offsetX}px`;
        el.style.top = `${dialogue.y + state.world.offsetY}px`;
      }
      renderInspector();
      scheduleConnectionRender();
    }

    function onDocumentPointerUp(event) {
      if (state.panning) {
        $("canvasScroll").classList.remove("panning");
        state.panning = null;
      }

      if (state.connecting) {
        const sourceId = state.connecting.sourceId;
        const targetEl = document.elementFromPoint(event.clientX, event.clientY)?.closest?.(".dialogue-node");
        const targetId = targetEl?.dataset?.id || "";
        if (targetId && targetId !== sourceId) {
          setNextDialogue(sourceId, targetId);
        }
        state.connecting = null;
        hidePreviewConnection();
      }

      if (state.dragging) {
        const el = document.querySelector(`.dialogue-node[data-id="${CSS.escape(state.dragging.id)}"]`);
        el?.classList.remove("dragging");
        state.dragging = null;
        renderAll();
      }
    }

    function parseDirectoryListing(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      return [...doc.querySelectorAll("a")]
        .map((a) => a.getAttribute("href") || "")
        .filter((href) => href.endsWith(".json") && !href.startsWith(".."))
        .map((href) => decodeURIComponent(href.replace(/^\.\//, "")));
    }

    function getHttpDataBaseUrl() {
      const path = location.pathname.replace(/\\/g, "/");
      if (path.includes("/tools/")) {
        return new URL("../data/", location.href).href;
      }
      return new URL("data/", location.href).href;
    }

    function getHttpDataUrl(relativePath) {
      const path = String(relativePath || "").replace(/^data\//, "");
      return new URL(path, project.dataBaseUrl).href;
    }

    async function readTextFromProject(relativePath) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativePath.split("/");
        let dir = project.rootHandle;
        for (let i = 0; i < parts.length - 1; i++) {
          dir = await dir.getDirectoryHandle(parts[i]);
        }
        const fileHandle = await dir.getFileHandle(parts[parts.length - 1]);
        return (await fileHandle.getFile()).text();
      }

      if (project.mode === "http") {
        const url = getHttpDataUrl(relativePath);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${relativePath}`);
        return res.text();
      }

      throw new Error("프로젝트가 연결되지 않았습니다.");
    }

    async function writeTextToProject(relativePath, text) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativePath.split("/");
        let dir = project.rootHandle;
        for (let i = 0; i < parts.length - 1; i++) {
          dir = await dir.getDirectoryHandle(parts[i], { create: true });
        }
        const fileHandle = await dir.getFileHandle(parts[parts.length - 1], { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        return "fs";
      }

      const filename = relativePath.split("/").pop();
      const blob = new Blob([text], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      return "download";
    }

    async function listJsonFiles(relativeDir) {
      if (project.mode === "fs" && project.rootHandle) {
        const parts = relativeDir.split("/");
        let dir = project.rootHandle;
        try {
          for (const part of parts) {
            dir = await dir.getDirectoryHandle(part);
          }
        } catch {
          return [];
        }

        const names = [];
        for await (const entry of dir.values()) {
          if (entry.kind === "file" && entry.name.toLowerCase().endsWith(".json")) {
            names.push(entry.name);
          }
        }
        return names.sort();
      }

      if (project.mode === "http") {
        const normalizedDir = relativeDir.endsWith("/") ? relativeDir : `${relativeDir}/`;
        const url = getHttpDataUrl(normalizedDir);
        const res = await fetch(url);
        if (!res.ok) return [];
        return parseDirectoryListing(await res.text()).sort();
      }

      return [];
    }

    function sortChapters() {
      state.chapters.sort((a, b) => {
        const orderDiff = (Number(a.order) || 0) - (Number(b.order) || 0);
        if (orderDiff !== 0) return orderDiff;
        return a.id.localeCompare(b.id);
      });
      state.chaptersById = new Map(state.chapters.map((chapter) => [chapter.id, chapter]));
    }

    function selectChapter(chapterId) {
      if (!state.chaptersById.has(chapterId)) return;
      state.selectedChapterId = chapterId;
      state.selectedId = getInitialSelectedDialogueId(state.chaptersById.get(chapterId));
      state.selectedEdgeFrom = "";
      applyChapterToDialogues();
      applyInitialLayout();
      renderAll();
      requestAnimationFrame(() => fitCanvasToRoi(false));
    }

    function createNewChapter() {
      const maxOrder = state.chapters.reduce((max, chapter) => Math.max(max, Number(chapter.order) || 0), 0);
      let index = maxOrder + 1;
      let id = `chapter_${String(index).padStart(3, "0")}`;
      while (state.chaptersById.has(id)) {
        index += 1;
        id = `chapter_${String(index).padStart(3, "0")}`;
      }
      const chapter = normalizeChapter({
        id,
        title: `새 챕터 ${index}`,
        order: index,
        start_dialogue: "",
        description: "",
        dialogues: [],
        layout: { positions: {} },
        metadata: {},
      }, `${id}.json`);
      chapter.isNew = true;
      state.chapters.push(chapter);
      sortChapters();
      state.selectedChapterId = chapter.id;
      markChapterDirty(chapter.id);
      selectChapter(chapter.id);
    }

    function syncChapterData(chapter) {
      if (!chapter) return;
      chapter.data.id = chapter.id;
      chapter.data.title = chapter.title;
      chapter.data.order = Number(chapter.order) || 0;
      chapter.data.start_dialogue = chapter.start_dialogue || "";
      chapter.data.description = chapter.description || "";
      chapter.data.dialogues = [...chapter.dialogueIds];
      chapter.data.metadata = chapter.metadata || {};
      if (!chapter.data.layout || typeof chapter.data.layout !== "object" || Array.isArray(chapter.data.layout)) {
        chapter.data.layout = {};
      }
      chapter.data.layout.positions = getChapterPositions(chapter);
    }

    function renameSelectedChapter(rawId) {
      const chapter = getSelectedChapter();
      if (!chapter) return;
      const input = $("fieldChapterId");
      const oldId = chapter.id;
      const nextId = sanitizeSegment(rawId, oldId);
      if (!nextId) {
        input.classList.add("invalid");
        return;
      }
      if (nextId !== oldId && state.chaptersById.has(nextId)) {
        input.classList.add("invalid");
        $("status").textContent = `이미 존재하는 챕터 ID입니다: ${nextId}`;
        $("status").className = "status error";
        return;
      }

      input.classList.remove("invalid");
      input.value = nextId;
      if (nextId === oldId) return;

      chapter.id = nextId;
      if (chapter.isNew) chapter.filename = `${nextId}.json`;
      state.selectedChapterId = nextId;
      state.chapterDirtyIds.delete(oldId);
      syncChapterData(chapter);
      sortChapters();
      markChapterDirty(nextId);
      renderAll();
    }

    function updateSelectedChapterField(field, value) {
      const chapter = getSelectedChapter();
      if (!chapter) return;
      if (field === "title") {
        chapter.title = String(value || "").trim();
      } else if (field === "order") {
        const order = Number(value);
        chapter.order = Number.isFinite(order) ? Math.max(0, Math.round(order)) : 0;
        sortChapters();
      } else if (field === "start_dialogue") {
        chapter.start_dialogue = normalizeId(value);
      } else if (field === "description") {
        chapter.description = String(value || "");
      }
      syncChapterData(chapter);
      markChapterDirty(chapter.id);
      renderValidation();
    }

    function updateSelectedChapterMetadata(rawValue) {
      const chapter = getSelectedChapter();
      if (!chapter) return;
      const field = $("fieldChapterMetadata");
      try {
        const parsed = JSON.parse(String(rawValue || "{}"));
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("metadata는 JSON 객체여야 합니다.");
        }
        field.classList.remove("invalid");
        chapter.metadata = parsed;
        syncChapterData(chapter);
        markChapterDirty(chapter.id);
        renderValidation();
      } catch (err) {
        field.classList.add("invalid");
        $("status").textContent = `챕터 metadata 오류: ${err.message}`;
        $("status").className = "status error";
      }
    }

    async function loadChaptersFromProject() {
      let names = await listJsonFiles("data/chapters");
      const loaded = [];
      for (const filename of names) {
        try {
          const text = await readTextFromProject(`data/chapters/${filename}`);
          const data = JSON.parse(text);
          loaded.push(normalizeChapter(data, filename));
        } catch (err) {
          console.warn("챕터 파일 로드 실패:", filename, err);
        }
      }

      if (loaded.length === 0) {
        loaded.push(normalizeChapter({
          id: "chapter_001",
          title: "1화 - 비의 장막",
          order: 1,
          start_dialogue: state.byId.has("chapter_001_intro") ? "chapter_001_intro" : (state.dialogues[0]?.id || ""),
          description: "",
          dialogues: state.dialogues.map((dialogue) => dialogue.id),
          layout: { positions: {} },
          metadata: {},
        }, "chapter_001.json"));
      }

      state.chapters = loaded;
      sortChapters();
      if (!state.chaptersById.has(state.selectedChapterId)) {
        state.selectedChapterId = state.chapters[0]?.id || "";
      }
      applyChapterToDialogues();
      state.selectedId = getInitialSelectedDialogueId();
    }

    async function loadDialoguesFromProject() {
      const names = await listJsonFiles("data/dialogues");
      const loaded = [];
      for (const filename of names) {
        try {
          const text = await readTextFromProject(`data/dialogues/${filename}`);
          const data = JSON.parse(text);
          const id = getDialogueId(data, filename);
          if (!id) continue;
          const metadata = getMetadata(data);
          const pos = getEditorPosition(metadata);
          const firstNode = getFirstNode(data);
          const count = getNodeCount(data);
          loaded.push({
            id,
            label: getDialogueLabel(data, id),
            filename,
            data,
            next: normalizeId(metadata[METADATA_NEXT_DIALOGUE]),
            mode: isStatementDialogue(data) ? "statement" : "normal",
            count,
            start: normalizeId(data.start),
            preview: stripDialogueTextMarkers(firstNode?.text || ""),
            chapterKey: inferChapterKey(id),
            x: pos?.x ?? 120,
            y: pos?.y ?? 120,
            defaultX: pos?.x ?? 120,
            defaultY: pos?.y ?? 120,
            hasSavedPosition: Boolean(pos),
          });
        } catch (err) {
          console.warn("대화 파일 로드 실패:", filename, err);
        }
      }

      loaded.sort((a, b) => a.id.localeCompare(b.id));
      state.dialogues = loaded;
      state.byId = new Map(loaded.map((dialogue) => [dialogue.id, dialogue]));
      state.selectedId = loaded[0]?.id || "";
      state.selectedEdgeFrom = "";
      state.dirtyIds.clear();
      state.chapterDirtyIds.clear();
      await loadChaptersFromProject();
      renderChapterFilter();
      applyInitialLayout();
      $("btnReload").disabled = false;
      $("btnNewChapter").disabled = false;
      $("chapterSelect").disabled = state.chapters.length === 0;
      $("btnAutoLayout").disabled = loaded.length === 0;
      $("btnCenterCanvas").disabled = loaded.length === 0;
      $("btnSave").disabled = true;
      renderAll();
      requestAnimationFrame(() => fitCanvasToRoi(false));
      $("status").textContent = `${loaded.length}개 대화 로드됨`;
      $("status").className = "status";
    }

    function updateProjectBadge(label) {
      const badge = $("projectBadge");
      badge.textContent = label;
      badge.classList.remove("hidden");
    }

    async function connectProjectViaHttp() {
      project.mode = "http";
      project.dataBaseUrl = getHttpDataBaseUrl();
      await loadDialoguesFromProject();
      updateProjectBadge("HTTP · data/");
    }

    async function connectProjectViaFs(rootHandle) {
      project.mode = "fs";
      project.rootHandle = rootHandle;
      await saveProjectHandle(rootHandle);
      await loadDialoguesFromProject();
      updateProjectBadge(`폴더 · ${rootHandle.name}`);
    }

    async function connectProject() {
      if (window.showDirectoryPicker) {
        try {
          const handle = await window.showDirectoryPicker({
            id: "blind-madeleine-project",
            mode: "readwrite",
            startIn: "documents",
          });
          await connectProjectViaFs(handle);
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
          console.warn("Directory picker failed:", err);
        }
      }

      try {
        await connectProjectViaHttp();
      } catch (err) {
        alert("프로젝트 연결 실패.\n\n방법 1: Chrome/Edge에서 '프로젝트 연결'로 게임 루트 폴더 선택\n방법 2: 프로젝트 루트에서 로컬 서버 실행\n  python -m http.server 8080\n  -> http://localhost:8080/tools/chapter_editor.html");
      }
    }

    async function tryAutoConnect() {
      const handle = await loadProjectHandle();
      if (handle) {
        try {
          const perm = await handle.queryPermission({ mode: "readwrite" });
          if (perm === "granted") {
            await connectProjectViaFs(handle);
            return true;
          }
          if (perm === "prompt") {
            const req = await handle.requestPermission({ mode: "readwrite" });
            if (req === "granted") {
              await connectProjectViaFs(handle);
              return true;
            }
          }
        } catch (err) {
          console.warn("Stored handle reconnect failed:", err);
        }
      }

      if (location.protocol === "http:" || location.protocol === "https:") {
        try {
          await connectProjectViaHttp();
          return true;
        } catch {
          /* fall through */
        }
      }

      return false;
    }

    function openIndexedDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          req.result.createObjectStore(STORE_NAME);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveProjectHandle(handle) {
      try {
        const db = await openIndexedDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.warn("프로젝트 핸들 저장 실패:", err);
      }
    }

    async function loadProjectHandle() {
      try {
        const db = await openIndexedDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(tx.error);
        });
      } catch {
        return null;
      }
    }

    async function saveChanges() {
      const dialogueIds = [...state.dirtyIds];
      const chapterIds = [...state.chapterDirtyIds];
      if (dialogueIds.length === 0 && chapterIds.length === 0) return;

      const validationErrors = collectValidationMessages().filter((message) => message.kind === "error");
      if (validationErrors.length > 0 && !confirm(`검증 오류 ${validationErrors.length}건이 있습니다. 그래도 저장할까요?`)) {
        return;
      }

      let downloadCount = 0;
      try {
        for (const id of dialogueIds) {
          const dialogue = state.byId.get(id);
          if (!dialogue) continue;
          const data = dialogue.data;
          data.metadata = {
            ...getMetadata(data),
          };
          if (dialogue.next) {
            data.metadata[METADATA_NEXT_DIALOGUE] = dialogue.next;
          } else {
            delete data.metadata[METADATA_NEXT_DIALOGUE];
          }

          const writeMode = await writeTextToProject(`data/dialogues/${dialogue.filename}`, JSON.stringify(data, null, 2) + "\n");
          if (writeMode === "download") downloadCount += 1;
        }

        for (const id of chapterIds) {
          const chapter = state.chaptersById.get(id);
          if (!chapter) continue;
          syncChapterData(chapter);
          const filename = chapter.filename || `${chapter.id}.json`;
          const writeMode = await writeTextToProject(`data/chapters/${filename}`, JSON.stringify(buildChapterExportObject(chapter), null, 2) + "\n");
          chapter.isNew = false;
          if (writeMode === "download") downloadCount += 1;
        }

        markClean();
        if (downloadCount > 0) {
          alert(`${downloadCount}개 파일이 다운로드 폴더에 저장되었습니다. 프로젝트의 data/chapters 또는 data/dialogues 폴더에 반영해 주세요.`);
        }
      } catch (err) {
        $("status").textContent = `저장 실패: ${err.message}`;
        $("status").className = "status error";
        alert("저장 실패: " + err.message);
      }
    }

    function centerCanvasOnSelection() {
      const current = state.byId.get(state.selectedId);
      const selected = (current && isDialogueInSelectedChapter(current.id) ? current : null)
        || getPlacedDialogues()[0];
      if (!selected) return;
      centerCanvasOnBounds({
        centerX: selected.x + NODE_WIDTH * 0.5,
        centerY: selected.y + NODE_MIN_HEIGHT * 0.5,
      }, true);
    }

    $("btnConnectProject").addEventListener("click", connectProject);
    $("btnReload").addEventListener("click", async () => {
      if ((state.dirtyIds.size > 0 || state.chapterDirtyIds.size > 0) && !confirm("저장되지 않은 변경사항을 버리고 새로고침할까요?")) {
        return;
      }
      await loadDialoguesFromProject();
    });
	    $("btnSave").addEventListener("click", saveChanges);
	    $("btnOpenDialogueEditor").addEventListener("click", (event) => {
	      event.stopPropagation();
	      openSelectedDialogueInEditor();
	    });
	    $("chapterSelect").addEventListener("change", (event) => {
	      selectChapter(event.target.value);
	    });
    $("btnNewChapter").addEventListener("click", createNewChapter);
    $("fieldChapterId").addEventListener("change", (event) => {
      renameSelectedChapter(event.target.value);
    });
    $("fieldChapterTitle").addEventListener("input", (event) => {
      updateSelectedChapterField("title", event.target.value);
    });
    $("fieldChapterOrder").addEventListener("input", (event) => {
      updateSelectedChapterField("order", event.target.value);
    });
    $("fieldChapterStart").addEventListener("change", (event) => {
      updateSelectedChapterField("start_dialogue", event.target.value);
    });
    $("fieldChapterDescription").addEventListener("input", (event) => {
      updateSelectedChapterField("description", event.target.value);
    });
    $("fieldChapterMetadata").addEventListener("change", (event) => {
      updateSelectedChapterMetadata(event.target.value);
    });
    $("btnAutoLayout").addEventListener("click", () => {
      autoLayoutDialogues(true);
      fitCanvasToRoi(true);
    });
    $("btnCenterCanvas").addEventListener("click", () => fitCanvasToRoi(true));
    $("btnClearSelected").addEventListener("click", () => {
      if (state.selectedEdgeFrom) {
        setNextDialogue(state.selectedEdgeFrom, "");
        return;
      }
      if (state.selectedId) {
        setNextDialogue(state.selectedId, "");
      }
    });
    $("btnRemoveSelected").addEventListener("click", () => {
      if (state.selectedId) removeDialogueFromCanvas(state.selectedId);
    });
    $("chapterFilter").addEventListener("change", (event) => {
      state.filter = event.target.value;
      state.selectedEdgeFrom = "";
      renderAll();
    });
    $("dialogueSearch").addEventListener("input", (event) => {
      state.search = event.target.value.trim();
      state.selectedEdgeFrom = "";
      renderAll();
    });
    $("zoomRange").addEventListener("input", (event) => {
      setZoom(Number(event.target.value) / 100);
    });
    $("canvasScroll").addEventListener("click", (event) => {
      if (event.target.closest?.(".dialogue-node") || event.target.classList?.contains("connection-path")) return;
      state.selectedId = "";
      state.selectedEdgeFrom = "";
      renderAll();
    });
    $("canvasScroll").addEventListener("pointerdown", onCanvasPointerDown);
    $("canvasScroll").addEventListener("dragover", onCanvasDragOver);
    $("canvasScroll").addEventListener("dragleave", onCanvasDragLeave);
    $("canvasScroll").addEventListener("drop", onCanvasDrop);
    $("canvasScroll").addEventListener("auxclick", (event) => {
      if (event.button === 1) event.preventDefault();
    });
    document.addEventListener("pointermove", onDocumentPointerMove);
    document.addEventListener("pointerup", onDocumentPointerUp);
    window.addEventListener("resize", scheduleConnectionRender);
    window.addEventListener("beforeunload", (event) => {
      if (state.dirtyIds.size === 0 && state.chapterDirtyIds.size === 0) return;
      event.preventDefault();
      event.returnValue = "";
    });

	    initCollapsiblePanels();
	    renderCanvasTransform();
	    tryAutoConnect();
  </script>
</body>
