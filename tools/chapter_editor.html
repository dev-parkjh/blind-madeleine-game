<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챕터 에디터 - Blind Madeleine</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("../assets/fonts/PretendardVariable.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }

    :root {
      --bg: #12101a;
      --bg-panel: #1a1724;
      --bg-input: #0f0d14;
      --border: #2e2940;
      --border-strong: #46405a;
      --text: #e8e4f0;
      --text-muted: #8a849c;
      --accent: #c9a86c;
      --accent-dim: #8a7348;
      --danger: #c96c7a;
      --success: #7ab88a;
      --statement: #77a6d9;
      --radius: 8px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: "Consolas", "D2Coding", monospace;
      --scrollbar-size: 10px;
      --scrollbar-thumb: rgba(255, 255, 255, 0.18);
      --scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
      --scrollbar-thumb-active: rgba(255, 255, 255, 0.42);
    }

    html {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    *::-webkit-scrollbar {
      width: var(--scrollbar-size);
      height: var(--scrollbar-size);
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover);
    }

    *::-webkit-scrollbar-thumb:active {
      background-color: var(--scrollbar-thumb-active);
    }

    *::-webkit-scrollbar-corner {
      background: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-right: auto;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .btn:hover {
      border-color: var(--accent-dim);
      background: #1a1628;
    }

    .btn-primary {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent);
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: rgba(201, 108, 122, 0.15);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.78rem;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1rem;
      line-height: 1;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input,
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-dim);
    }

    input.invalid,
    select.invalid,
    textarea.invalid {
      border-color: var(--danger);
    }

    select {
      cursor: pointer;
    }

    textarea {
      resize: vertical;
      min-height: 92px;
      line-height: 1.5;
    }

    .mono {
      font-family: var(--mono);
    }

    .status {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius);
      background: var(--bg-input);
      white-space: nowrap;
    }

    .status.dirty {
      color: var(--accent);
    }

    .status.error {
      color: var(--danger);
    }

    .project-badge {
      font-size: 0.72rem;
      color: var(--success);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(122, 184, 138, 0.35);
      background: rgba(122, 184, 138, 0.08);
      white-space: nowrap;
    }

    .header-select {
      width: 220px;
      min-width: 180px;
    }

    .hidden {
      display: none !important;
    }

    main {
      display: grid;
      grid-template-columns: 300px minmax(520px, 1fr) 330px;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 1100px) {
      html,
      body {
        height: auto;
        overflow: auto;
      }

      main {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 280px;
      }

      .canvas-panel {
        min-height: 620px;
      }
    }

    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
      border-left: 1px solid var(--border);
    }

	    .panel-header {
	      padding: 12px 14px;
	      font-size: 0.8rem;
	      font-weight: 600;
	      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
	      gap: 8px;
	      flex-shrink: 0;
	    }

	    .panel-header-collapsible {
	      padding: 0;
	      align-items: stretch;
	    }

	    .section-toggle {
	      flex: 1;
	      min-width: 0;
	      display: flex;
	      align-items: center;
	      justify-content: space-between;
	      gap: 8px;
	      padding: 12px 14px;
	      border: 0;
	      background: transparent;
	      color: inherit;
	      font: inherit;
	      text-transform: inherit;
	      letter-spacing: inherit;
	      cursor: pointer;
	    }

	    .section-toggle:hover {
	      color: var(--accent);
	    }

	    .collapse-icon {
	      display: inline-flex;
	      transition: transform 0.15s;
	    }

	    .section-toggle[aria-expanded="false"] .collapse-icon {
	      transform: rotate(-90deg);
	    }

	    .panel-header-action {
	      width: 32px;
	      height: 32px;
	      margin: 7px 10px 7px 0;
	      padding: 0;
	      display: inline-flex;
	      align-items: center;
	      justify-content: center;
	      border-radius: 7px;
	      border: 1px solid var(--border);
	      background: var(--bg-input);
	      color: var(--text-muted);
	      cursor: pointer;
	    }

	    .panel-header-action:hover:not(:disabled) {
	      color: var(--accent);
	      border-color: var(--accent-dim);
	    }

	    .panel-header-action:disabled {
	      opacity: 0.4;
	      cursor: not-allowed;
	    }

	    .collapsible-body.collapsed {
	      display: none;
	    }

    .sidebar-section {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      overflow: visible;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .hint {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .dialogue-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
    }

    .dialogue-list-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px 10px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-panel);
      cursor: grab;
      margin-bottom: 7px;
      transition: background 0.12s, border-color 0.12s;
    }

    .dialogue-list-item:hover {
      background: #211e2c;
      border-color: #3a3548;
    }

    .dialogue-list-item.active {
      background: rgba(201, 168, 108, 0.12);
      border-color: var(--accent-dim);
    }

    .dialogue-list-item:active {
      cursor: grabbing;
    }

    .dialogue-list-item.unplaced {
      border-style: dashed;
      background: rgba(15, 13, 20, 0.72);
    }

    .dialogue-list-title {
      min-width: 0;
      font-size: 0.86rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dialogue-list-file,
    .dialogue-list-meta {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.7rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dialogue-list-file {
      grid-column: 1 / -1;
    }

    .dialogue-list-item > span:last-child {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.035);
      white-space: nowrap;
    }

    .badge.statement {
      color: var(--statement);
      border-color: rgba(119, 166, 217, 0.36);
      background: rgba(119, 166, 217, 0.08);
    }

    .badge.dirty {
      color: var(--accent);
      border-color: rgba(201, 168, 108, 0.5);
      background: rgba(201, 168, 108, 0.08);
    }

    .badge.end {
      color: var(--success);
      border-color: rgba(122, 184, 138, 0.42);
      background: rgba(122, 184, 138, 0.08);
    }

    .badge.unplaced {
      color: var(--text-muted);
      border-color: rgba(138, 132, 156, 0.36);
      background: rgba(138, 132, 156, 0.08);
    }

    .canvas-panel {
      background: #0f0d14;
      position: relative;
    }

    .canvas-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 23, 36, 0.92);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .canvas-toolbar .spacer {
      flex: 1;
    }

    .zoom-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 190px;
      color: var(--text-muted);
      font-size: 0.76rem;
    }

    .zoom-control input {
      padding: 0;
      accent-color: var(--accent);
    }

    .canvas-scroll {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      background-color: #100e16;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(201, 168, 108, 0.07), transparent 42%);
      background-size: 32px 32px, 32px 32px, 1200px 900px;
      cursor: default;
    }

    .canvas-scroll.drop-target {
      outline: 2px solid rgba(201, 168, 108, 0.38);
      outline-offset: -2px;
    }

    .canvas-scroll.panning {
      cursor: grabbing;
    }

    .canvas-world {
      position: relative;
      width: 3600px;
      height: 2400px;
      transform-origin: 0 0;
    }

    .canvas-content {
      position: absolute;
      inset: 0;
      width: 3600px;
      height: 2400px;
      transform-origin: 0 0;
    }

    .connection-svg {
      position: absolute;
      inset: 0;
      width: 3600px;
      height: 2400px;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .connection-path {
      fill: none;
      stroke: rgba(201, 168, 108, 0.72);
      stroke-width: 2.4;
      stroke-linecap: round;
      pointer-events: stroke;
      cursor: pointer;
      transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s;
    }

    .connection-path:hover,
    .connection-path.selected {
      stroke: var(--accent);
      stroke-width: 3.2;
      opacity: 1;
    }

    .connection-path.invalid {
      stroke: rgba(201, 108, 122, 0.78);
      stroke-dasharray: 9 7;
    }

    .connection-path.preview {
      stroke: rgba(232, 228, 240, 0.58);
      stroke-dasharray: 8 7;
      pointer-events: none;
    }

    .dialogue-node {
      position: absolute;
      width: 292px;
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(26, 23, 36, 0.97);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
      padding: 13px 14px 12px;
      cursor: grab;
      user-select: none;
      z-index: 3;
      transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }

    .dialogue-node:hover {
      border-color: #3f3952;
      background: rgba(32, 29, 43, 0.98);
    }

    .dialogue-node.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(201, 168, 108, 0.14), 0 18px 42px rgba(0, 0, 0, 0.28);
    }

    .dialogue-node.dragging {
      cursor: grabbing;
      z-index: 5;
    }

    .node-topline {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .node-title {
      flex: 1;
      min-width: 0;
      font-size: 0.94rem;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-file {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.69rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 11px;
    }

    .node-preview {
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.45;
      min-height: 42px;
      max-height: 48px;
      overflow: hidden;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .node-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 9px;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .next-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--mono);
    }

    .port {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      background: var(--bg-input);
      box-shadow: 0 0 0 2px rgba(201, 168, 108, 0.12);
      cursor: crosshair;
      z-index: 6;
      transition: transform 0.12s, background 0.12s;
    }

    .port:hover {
      transform: scale(1.16);
      background: var(--accent);
    }

    .port-in {
      left: -8px;
      top: 70px;
    }

    .port-out {
      right: -8px;
      top: 70px;
    }

    .canvas-empty {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.7;
      z-index: 2;
      pointer-events: none;
    }

    .inspector {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .empty-state {
      display: flex;
      min-height: 220px;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
      padding: 24px;
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      min-width: 0;
    }

    .detail-title strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1rem;
      color: var(--accent);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 7px 10px;
      font-size: 0.78rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .meta-grid dt {
      color: var(--text-muted);
    }

    .meta-grid dd {
      color: var(--text);
      font-family: var(--mono);
      min-width: 0;
    }

    .incoming-list {
      display: grid;
      gap: 6px;
    }

    .incoming-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 9px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      cursor: pointer;
    }

    .incoming-chip:hover {
      color: var(--text);
      border-color: var(--accent-dim);
    }

    .validation-list {
      list-style: none;
      display: grid;
      gap: 8px;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .validation-list li {
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      background: var(--bg-input);
    }

    .validation-list li.error {
      border-color: rgba(201, 108, 122, 0.45);
      color: var(--danger);
      background: rgba(201, 108, 122, 0.07);
    }

    .validation-list li.warning {
      border-color: rgba(201, 168, 108, 0.45);
      color: var(--accent);
      background: rgba(201, 168, 108, 0.07);
    }
  </style>
</head>
<body>
  <header>
    <h1>챕터 에디터</h1>
    <span class="status" id="status">프로젝트를 연결하세요</span>
    <div class="header-controls">
      <button class="btn" id="btnConnectProject">프로젝트 연결</button>
      <span class="project-badge hidden" id="projectBadge"></span>
      <select class="header-select" id="chapterSelect" disabled>
        <option value="">챕터 없음</option>
      </select>
      <button class="btn" id="btnNewChapter" disabled>새 챕터</button>
      <button class="btn" id="btnReload" disabled>새로고침</button>
      <button class="btn btn-primary" id="btnSave" disabled>저장</button>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div class="panel-header"><span>대화 목록</span><span id="dialogueCount">0</span></div>
      <div class="sidebar-section">
        <div class="field">
          <label>필터</label>
          <select id="chapterFilter">
            <option value="">전체</option>
          </select>
        </div>
        <div class="field">
          <label>검색</label>
          <input type="search" id="dialogueSearch" placeholder="id, 파일명, 본문">
        </div>
      </div>
      <div class="dialogue-list" id="dialogueList"></div>
    </aside>

    <section class="panel canvas-panel">
      <div class="canvas-toolbar">
        <button class="btn btn-sm" id="btnAutoLayout" disabled>자동 배치</button>
        <button class="btn btn-sm" id="btnCenterCanvas" disabled>전체 보기</button>
        <button class="btn btn-sm btn-danger" id="btnClearSelected" disabled>연결 해제</button>
        <button class="btn btn-sm btn-danger" id="btnRemoveSelected" disabled>캔버스에서 제거</button>
        <div class="spacer"></div>
        <label class="zoom-control">
          <span>확대</span>
          <input type="range" id="zoomRange" min="30" max="140" value="100" step="5">
          <span id="zoomLabel">100%</span>
        </label>
      </div>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="canvas-world" id="canvasWorld">
          <div class="canvas-content" id="canvasContent">
            <svg class="connection-svg" id="connectionSvg" viewBox="0 0 3600 2400" aria-hidden="true">
              <defs>
                <marker id="arrowHead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
                  <path d="M 0 1 L 7 4 L 0 7 z" fill="rgba(201, 168, 108, 0.82)"></path>
                </marker>
                <marker id="arrowHeadInvalid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
                  <path d="M 0 1 L 7 4 L 0 7 z" fill="rgba(201, 108, 122, 0.82)"></path>
                </marker>
              </defs>
              <g id="connectionLayer"></g>
              <path id="connectionPreview" class="connection-path preview hidden"></path>
            </svg>
            <div id="nodeLayer"></div>
            <div class="canvas-empty" id="canvasEmpty">프로젝트 연결 후 대화 파일을 불러옵니다.</div>
          </div>
        </div>
      </div>
    </section>

	    <aside class="panel">
	      <div class="panel-header panel-header-collapsible">
	        <button type="button" class="section-toggle" data-collapse-target="chapterPanelBody" aria-expanded="true">
	          <span>챕터</span>
	          <span class="collapse-icon">▾</span>
	        </button>

	      <div class="sidebar-section collapsible-body" id="chapterPanelBody">
        <div class="field">
          <label>챕터 ID <span class="hint">파일명</span></label>
          <input type="text" id="fieldChapterId" placeholder="chapter_001" disabled>
        </div>
        <div class="field">
          <label>이름</label>
          <input type="text" id="fieldChapterTitle" placeholder="1화 - 비의 장막" disabled>
        </div>
        <div class="field">
          <label>순서</label>
          <input type="number" id="fieldChapterOrder" min="0" step="1" value="1" disabled>
        </div>
        <div class="field">
          <label>시작 대화</label>
          <select id="fieldChapterStart" disabled>
            <option value="">선택 없음</option>
          </select>
        </div>
        <div class="field">
          <label>설명</label>
          <textarea id="fieldChapterDescription" rows="3" placeholder="챕터 설명" disabled></textarea>
        </div>
        <div class="field">
          <label>메타데이터 JSON</label>
          <textarea class="mono" id="fieldChapterMetadata" rows="4" disabled>{}</textarea>
        </div>
      </div>
	      <div class="panel-header panel-header-collapsible">
	        <button type="button" class="section-toggle" data-collapse-target="detailPanelBody" aria-expanded="true">
	          <span>상세</span>
	          <span class="collapse-icon">▾</span>
	        </button>
	        <button type="button" class="panel-header-action hidden" id="btnOpenDialogueEditor" disabled title="대사 에디터에서 열기" aria-label="대사 에디터에서 열기">
	          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
	            <path d="M7 17L17 7"></path>
	            <path d="M9 7h8v8"></path>
	            <path d="M5 5h6"></path>
	            <path d="M5 5v14h14v-6"></path>
	          </svg>
	        </button>
	      </div>
	      <div class="inspector collapsible-body" id="detailPanelBody">
	        <div id="inspector">
	        <div class="empty-state">캔버스의 대화를 선택하세요.</div>
	        </div>
	      </div>
      <div class="panel-header"><span>검증</span></div>
      <div class="sidebar-section">
        <ul class="validation-list" id="validationList"></ul>
      </div>
    </aside>
  </main>

  <script>
    const DB_NAME = "blind-madeleine-dialogue-editor";
    const STORE_NAME = "settings";
    const HANDLE_KEY = "projectHandle";
    const METADATA_NEXT_DIALOGUE = "next_dialogue";
    const METADATA_PRESENTATION_MODE = "presentation_mode";
    const METADATA_CHAPTER_EDITOR = "chapter_editor";
    const BASE_WORLD_WIDTH = 3600;
    const BASE_WORLD_HEIGHT = 2400;
    const ROI_FREE_PAN_PX = 720;
    const ROI_FIT_MARGIN_PX = 96;
    const MIN_ZOOM = 0.3;
    const MAX_ZOOM = 1.4;
    const FIT_MAX_ZOOM = 1.15;
    const NODE_WIDTH = 292;
    const NODE_MIN_HEIGHT = 150;
    const PORT_CONNECTION_PADDING = 14;
    const GRID_X = 410;
    const GRID_Y = 230;

    const state = {
      chapters: [],
      chaptersById: new Map(),
      selectedChapterId: "",
      dialogues: [],
      byId: new Map(),
      selectedId: "",
      selectedEdgeFrom: "",
      filter: "",
      search: "",
      dirtyIds: new Set(),
      chapterDirtyIds: new Set(),
      zoom: 1,
      connecting: null,
      dragging: null,
      panning: null,
      listDraggingId: "",
      renderFrame: 0,
      world: {
        x: 0,
        y: 0,
        width: BASE_WORLD_WIDTH,
        height: BASE_WORLD_HEIGHT,
        offsetX: 0,
        offsetY: 0,
      },
    };

    const project = {
      mode: "none",
      rootHandle: null,
      dataBaseUrl: "",
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeId(value) {
      return String(value || "").trim();
    }

    function dialogueFilenameToId(filename) {
      return String(filename || "").replace(/\.json$/i, "");
    }

    function chapterFilenameToId(filename) {
      return String(filename || "").replace(/\.json$/i, "");
    }

    function getSelectedChapter() {
      return state.chaptersById.get(state.selectedChapterId) || null;
    }

    function normalizeIdList(value) {
      const source = Array.isArray(value)
        ? value
        : (typeof value === "string" ? [value] : []);
      const ids = [];
      const seen = new Set();
      source.forEach((raw) => {
        const id = normalizeId(raw);
        if (!id || seen.has(id)) return;
        seen.add(id);
        ids.push(id);
      });
      return ids;
    }

    function getChapterLayout(data) {
      return data && typeof data.layout === "object" && !Array.isArray(data.layout)
        ? data.layout
        : {};
    }

    function getChapterPositions(chapter) {
      const layout = getChapterLayout(chapter?.data || {});
      return layout.positions && typeof layout.positions === "object" && !Array.isArray(layout.positions)
        ? layout.positions
        : {};
    }

    function getChapterDialogueIdSet(chapter = getSelectedChapter()) {
      return new Set(chapter?.dialogueIds || []);
    }

    function getInitialSelectedDialogueId(chapter = getSelectedChapter()) {
      if (!chapter) return state.dialogues[0]?.id || "";
      if (chapter.start_dialogue && chapter.dialogueIds.includes(chapter.start_dialogue) && state.byId.has(chapter.start_dialogue)) {
        return chapter.start_dialogue;
      }
      return chapter.dialogueIds.find((id) => state.byId.has(id)) || "";
    }

    function isDialogueInSelectedChapter(id) {
      return getChapterDialogueIdSet().has(id);
    }

    function addDialogueToChapter(id, chapter = getSelectedChapter()) {
      if (!chapter) return;
      if (!chapter.dialogueIds.includes(id)) {
        chapter.dialogueIds.push(id);
      }
      chapter.data.dialogues = [...chapter.dialogueIds];
    }

    function removeDialogueFromChapter(id, chapter = getSelectedChapter()) {
      if (!chapter) return;
      chapter.dialogueIds = chapter.dialogueIds.filter((dialogueId) => dialogueId !== id);
      chapter.data.dialogues = [...chapter.dialogueIds];
      const positions = getChapterPositions(chapter);
      delete positions[id];
      if (!chapter.data.layout || typeof chapter.data.layout !== "object") chapter.data.layout = {};
      chapter.data.layout.positions = positions;
    }

    function setChapterPosition(id, x, y, chapter = getSelectedChapter()) {
      if (!chapter) return;
      if (!chapter.data.layout || typeof chapter.data.layout !== "object" || Array.isArray(chapter.data.layout)) {
        chapter.data.layout = {};
      }
      const positions = getChapterPositions(chapter);
      positions[id] = [Math.round(x), Math.round(y)];
      chapter.data.layout.positions = positions;
    }

    function getDialogueId(data, filename) {
      return dialogueFilenameToId(filename);
    }

    function getDialogueLabel(data, id) {
      return normalizeId(data?.label || data?.title || data?.display_name || data?.name) || id;
    }

    function getDialogueDisplay(dialogue) {
      return dialogue?.label || dialogue?.id || "";
    }

    function getMetadata(data) {
      return data && typeof data.metadata === "object" && !Array.isArray(data.metadata)
        ? data.metadata
        : {};
    }

    function getEditorConfig(metadata) {
      const editor = metadata?.[METADATA_CHAPTER_EDITOR];
      return editor && typeof editor === "object" && !Array.isArray(editor)
        ? editor
        : {};
    }

    function getEditorPosition(metadata) {
      const editor = getEditorConfig(metadata);
      const raw = editor.position;
      if (!Array.isArray(raw) || raw.length < 2) return null;
      const x = Number(raw[0]);
      const y = Number(raw[1]);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      return {
        x,
        y,
      };
    }

    function stripDialogueTextMarkers(text) {
      return String(text || "")
        .replace(/\|[0-9.]*\|/g, " ")
        .replace(/\\\|/g, "|")
        .replace(/\|/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function sanitizeSegment(text, fallback = "chapter") {
      const value = String(text || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]+/g, "_")
        .replace(/^_+|_+$/g, "");
      return value || fallback;
    }

    function normalizeChapter(data = {}, filename = "") {
      const id = normalizeId(data.id) || chapterFilenameToId(filename) || "chapter";
      const layout = getChapterLayout(data);
      const positions = layout.positions && typeof layout.positions === "object" && !Array.isArray(layout.positions)
        ? { ...layout.positions }
        : {};
      const dialogueIds = normalizeIdList(data.dialogues || data.dialogue_ids || []);
      return {
        id,
        filename: filename || `${id}.json`,
        isNew: false,
        title: normalizeId(data.title || data.name || data.display_name) || id,
        order: Number.isFinite(Number(data.order)) ? Number(data.order) : 0,
        start_dialogue: normalizeId(data.start_dialogue || data.dialogue_id || data.first_dialogue),
        description: String(data.description || ""),
        metadata: data.metadata && typeof data.metadata === "object" && !Array.isArray(data.metadata) ? { ...data.metadata } : {},
        dialogueIds,
        data: {
          ...data,
          id,
          title: normalizeId(data.title || data.name || data.display_name) || id,
          order: Number.isFinite(Number(data.order)) ? Number(data.order) : 0,
          start_dialogue: normalizeId(data.start_dialogue || data.dialogue_id || data.first_dialogue),
          description: String(data.description || ""),
          dialogues: dialogueIds,
          layout: {
            ...layout,
            positions,
          },
          metadata: data.metadata && typeof data.metadata === "object" && !Array.isArray(data.metadata) ? { ...data.metadata } : {},
        },
      };
    }

    function buildChapterExportObject(chapter) {
      const positions = getChapterPositions(chapter);
      const exportPositions = {};
      chapter.dialogueIds.forEach((id) => {
        const position = positions[id];
        if (Array.isArray(position) && position.length >= 2) {
          exportPositions[id] = [Math.round(Number(position[0]) || 0), Math.round(Number(position[1]) || 0)];
        }
      });
      const data = {
        ...chapter.data,
        id: chapter.id,
        title: chapter.title,
        order: Number(chapter.order) || 0,
        start_dialogue: chapter.start_dialogue || "",
        description: chapter.description || "",
        dialogues: [...chapter.dialogueIds],
        layout: {
          ...(chapter.data.layout || {}),
          positions: exportPositions,
        },
        metadata: chapter.metadata || {},
      };
      return data;
    }

    function getFirstNode(data) {
      const nodeLists = [
        Array.isArray(data.nodes) ? data.nodes : [],
        Array.isArray(data.statement_nodes) ? data.statement_nodes : [],
      ];
      for (const list of nodeLists) {
        const node = list.find((entry) => entry && typeof entry === "object");
        if (node) return node;
      }
      return null;
    }

    function getNodeCount(data) {
      const normal = Array.isArray(data.nodes) ? data.nodes.length : 0;
      const statement = Array.isArray(data.statement_nodes) ? data.statement_nodes.length : 0;
      return { normal, statement, total: normal + statement };
    }

    function isStatementDialogue(data) {
      const metadata = getMetadata(data);
      if (String(metadata[METADATA_PRESENTATION_MODE] || "").trim() === "statement") return true;
      return Array.isArray(data.statement_nodes) && data.statement_nodes.length > 0;
    }

    function inferChapterKey(id) {
      const chapterMatch = String(id).match(/^(chapter_\d+)/i);
      if (chapterMatch) return chapterMatch[1];
      const statementMatch = String(id).match(/^(statement_\d+)/i);
      if (statementMatch) return statementMatch[1];
      return "기타";
    }

    function isVisibleDialogue(dialogue) {
      if (state.filter && dialogue.chapterKey !== state.filter) return false;
      if (!state.search) return true;
      const haystack = [
        dialogue.id,
        dialogue.label,
        dialogue.filename,
        dialogue.next,
        dialogue.preview,
        dialogue.mode,
      ].join(" ").toLowerCase();
      return haystack.includes(state.search.toLowerCase());
    }

    function getVisibleDialogues() {
      return state.dialogues.filter(isVisibleDialogue);
    }

    function getCanvasDialogues() {
      const ids = getChapterDialogueIdSet();
      return state.dialogues.filter((dialogue) => ids.has(dialogue.id) && isVisibleDialogue(dialogue));
    }

    function getPlacedDialogues() {
      const ids = getChapterDialogueIdSet();
      return state.dialogues.filter((dialogue) => ids.has(dialogue.id));
    }

    function getPlacedDialogueBounds(dialogues = getPlacedDialogues()) {
      if (dialogues.length === 0) return null;
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      dialogues.forEach((dialogue) => {
        minX = Math.min(minX, dialogue.x);
        minY = Math.min(minY, dialogue.y);
        maxX = Math.max(maxX, dialogue.x + NODE_WIDTH);
        maxY = Math.max(maxY, dialogue.y + NODE_MIN_HEIGHT);
      });
      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(NODE_WIDTH, maxX - minX),
        height: Math.max(NODE_MIN_HEIGHT, maxY - minY),
        centerX: (minX + maxX) * 0.5,
        centerY: (minY + maxY) * 0.5,
      };
    }

    function updateWorldFromRoi() {
      const bounds = getPlacedDialogueBounds();
      const scroll = $("canvasScroll");
      const viewportWidth = scroll?.clientWidth || BASE_WORLD_WIDTH;
      const viewportHeight = scroll?.clientHeight || BASE_WORLD_HEIGHT;
      if (!bounds) {
        state.world = {
          x: 0,
          y: 0,
          width: Math.max(BASE_WORLD_WIDTH, viewportWidth / state.zoom),
          height: Math.max(BASE_WORLD_HEIGHT, viewportHeight / state.zoom),
          offsetX: 0,
          offsetY: 0,
        };
        return;
      }

      const worldX = bounds.minX - ROI_FREE_PAN_PX;
      const worldY = bounds.minY - ROI_FREE_PAN_PX;
      const minViewportWidth = viewportWidth / state.zoom + ROI_FREE_PAN_PX * 2;
      const minViewportHeight = viewportHeight / state.zoom + ROI_FREE_PAN_PX * 2;
      const worldWidth = Math.max(bounds.width + ROI_FREE_PAN_PX * 2, minViewportWidth, NODE_WIDTH + ROI_FREE_PAN_PX * 2);
      const worldHeight = Math.max(bounds.height + ROI_FREE_PAN_PX * 2, minViewportHeight, NODE_MIN_HEIGHT + ROI_FREE_PAN_PX * 2);
      state.world = {
        x: worldX,
        y: worldY,
        width: worldWidth,
        height: worldHeight,
        offsetX: -worldX,
        offsetY: -worldY,
      };
    }

    function syncDirtyState() {
      $("btnSave").disabled = state.dirtyIds.size === 0 && state.chapterDirtyIds.size === 0;
      const count = state.dirtyIds.size + state.chapterDirtyIds.size;
      $("status").textContent = count > 0 ? `${count}개 파일 변경됨` : "저장됨";
      $("status").className = count > 0 ? "status dirty" : "status";
      renderDialogueList();
      renderChapterSelect();
    }

    function markDirty(id) {
      if (id) state.dirtyIds.add(id);
      syncDirtyState();
    }

    function markChapterDirty(chapterId = state.selectedChapterId) {
      if (chapterId) state.chapterDirtyIds.add(chapterId);
      syncDirtyState();
    }

    function markClean() {
      state.dirtyIds.clear();
      state.chapterDirtyIds.clear();
      syncDirtyState();
    }

    function getIncomingIds(targetId) {
      return state.dialogues
        .filter((dialogue) => dialogue.next === targetId)
        .map((dialogue) => dialogue.id)
        .sort();
    }

    function setNextDialogue(sourceId, targetId) {
      const source = state.byId.get(sourceId);
      if (!source) return;
      const normalizedTarget = normalizeId(targetId);
      if (normalizedTarget === sourceId) return;
      source.next = normalizedTarget;
      source.data.metadata = {
        ...getMetadata(source.data),
      };
      if (normalizedTarget) {
        source.data.metadata[METADATA_NEXT_DIALOGUE] = normalizedTarget;
      } else {
        delete source.data.metadata[METADATA_NEXT_DIALOGUE];
      }
      state.selectedId = sourceId;
      state.selectedEdgeFrom = normalizedTarget ? sourceId : "";
      markDirty(sourceId);
      renderAll();
    }

    function setPosition(dialogue, x, y, dirty = true) {
      dialogue.x = clamp(Math.round(x), -100000, 100000);
      dialogue.y = clamp(Math.round(y), -100000, 100000);
      if (dirty) {
        setChapterPosition(dialogue.id, dialogue.x, dialogue.y);
        markChapterDirty();
      }
    }

    function placeDialogueOnCanvas(id, x, y) {
      const dialogue = state.byId.get(id);
      if (!dialogue) return;
      addDialogueToChapter(dialogue.id);
      setPosition(dialogue, x, y, false);
      setChapterPosition(dialogue.id, dialogue.x, dialogue.y);
      state.selectedId = dialogue.id;
      state.selectedEdgeFrom = "";
      markChapterDirty();
      renderAll();
    }

    function removeDialogueFromCanvas(id) {
      const dialogue = state.byId.get(id);
      if (!dialogue || !isDialogueInSelectedChapter(id)) return;
      removeDialogueFromChapter(id);
      state.selectedId = dialogue.id;
      state.selectedEdgeFrom = "";
      markChapterDirty();
      renderAll();
    }

    function getPortPosition(id, kind) {
      const port = document.querySelector(`.dialogue-node[data-id="${CSS.escape(id)}"] .port-${kind}`);
      const content = $("canvasContent");
      if (!port || !content) {
        const dialogue = state.byId.get(id);
        if (!dialogue) return { x: 0, y: 0 };
        return {
          x: dialogue.x + state.world.offsetX + (kind === "out" ? NODE_WIDTH : 0),
          y: dialogue.y + state.world.offsetY + 78,
        };
      }

      const portRect = port.getBoundingClientRect();
      const contentRect = content.getBoundingClientRect();
      return {
        x: (portRect.left + portRect.width * 0.5 - contentRect.left) / state.zoom,
        y: (portRect.top + portRect.height * 0.5 - contentRect.top) / state.zoom,
      };
    }

    function getConnectionAnchor(id, kind) {
      const point = getPortPosition(id, kind);
      return {
        x: point.x + (kind === "out" ? PORT_CONNECTION_PADDING : -PORT_CONNECTION_PADDING),
        y: point.y,
      };
    }

    function clientToWorld(clientX, clientY) {
      const point = clientToCanvasPoint(clientX, clientY);
      return {
        x: point.x - state.world.offsetX,
        y: point.y - state.world.offsetY,
      };
    }

    function clientToCanvasPoint(clientX, clientY) {
      const rect = $("canvasContent").getBoundingClientRect();
      return {
        x: (clientX - rect.left) / state.zoom,
        y: (clientY - rect.top) / state.zoom,
      };
    }

    function makePath(from, to) {
      const dx = Math.max(120, Math.abs(to.x - from.x) * 0.48);
      return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} C ${(from.x + dx).toFixed(1)} ${from.y.toFixed(1)}, ${(to.x - dx).toFixed(1)} ${to.y.toFixed(1)}, ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
    }

    function scheduleConnectionRender() {
      if (state.renderFrame) return;
      state.renderFrame = requestAnimationFrame(() => {
        state.renderFrame = 0;
        renderConnections();
      });
    }

    function renderConnections() {
      const layer = $("connectionLayer");
      const visibleIds = new Set(getCanvasDialogues().map((dialogue) => dialogue.id));
      const paths = [];

      state.dialogues.forEach((dialogue) => {
        if (!dialogue.next || !visibleIds.has(dialogue.id)) return;
        const target = state.byId.get(dialogue.next);
        if (target && !visibleIds.has(target.id)) return;
        const from = getConnectionAnchor(dialogue.id, "out");
        const to = target ? getConnectionAnchor(dialogue.next, "in") : { x: from.x + 180, y: from.y };
        const invalid = !target;
        const selected = state.selectedEdgeFrom === dialogue.id;
        paths.push(`
          <path
            class="connection-path${invalid ? " invalid" : ""}${selected ? " selected" : ""}"
            data-edge-from="${escapeAttr(dialogue.id)}"
            d="${makePath(from, to)}"
            marker-end="url(#${invalid ? "arrowHeadInvalid" : "arrowHead"})"
          ></path>
        `);
      });

      layer.innerHTML = paths.join("");
      layer.querySelectorAll(".connection-path").forEach((path) => {
        path.addEventListener("click", (event) => {
          event.stopPropagation();
          const from = path.dataset.edgeFrom || "";
          state.selectedEdgeFrom = from;
          state.selectedId = from;
          renderAll();
        });
      });
    }

    function updatePreviewConnection(clientX, clientY) {
      if (!state.connecting) return;
      const from = getConnectionAnchor(state.connecting.sourceId, "out");
      const to = clientToCanvasPoint(clientX, clientY);
      const preview = $("connectionPreview");
      preview.setAttribute("d", makePath(from, to));
      preview.classList.remove("hidden");
    }

    function hidePreviewConnection() {
      $("connectionPreview").classList.add("hidden");
      $("connectionPreview").removeAttribute("d");
    }

    function renderChapterSelect() {
      const select = $("chapterSelect");
      const selected = state.selectedChapterId;
      select.disabled = state.chapters.length === 0;
      select.innerHTML = state.chapters.length > 0
        ? state.chapters.map((chapter) => {
          const dirty = state.chapterDirtyIds.has(chapter.id) ? " *" : "";
          const order = Number(chapter.order) || 0;
          const label = `${order > 0 ? `${order}. ` : ""}${chapter.title || chapter.id}${dirty}`;
          return `<option value="${escapeAttr(chapter.id)}">${escapeHtml(label)}</option>`;
        }).join("")
        : `<option value="">챕터 없음</option>`;
      select.value = state.chaptersById.has(selected) ? selected : (state.chapters[0]?.id || "");
    }

    function renderChapterEditor() {
      const chapter = getSelectedChapter();
      const hasChapter = Boolean(chapter);
      ["fieldChapterId", "fieldChapterTitle", "fieldChapterOrder", "fieldChapterStart", "fieldChapterDescription", "fieldChapterMetadata"].forEach((id) => {
        $(id).disabled = !hasChapter;
      });
      if (!chapter) {
        $("fieldChapterId").value = "";
        $("fieldChapterTitle").value = "";
        $("fieldChapterOrder").value = "0";
        $("fieldChapterStart").innerHTML = `<option value="">선택 없음</option>`;
        $("fieldChapterDescription").value = "";
        $("fieldChapterMetadata").value = "{}";
        return;
      }

      $("fieldChapterId").value = chapter.id;
      $("fieldChapterTitle").value = chapter.title;
      $("fieldChapterOrder").value = String(chapter.order || 0);
      $("fieldChapterDescription").value = chapter.description || "";
      $("fieldChapterMetadata").value = JSON.stringify(chapter.metadata || {}, null, 2);
      $("fieldChapterStart").innerHTML = [
        `<option value="">선택 없음</option>`,

    function applyChapterToDialogues(chapter = getSelectedChapter()) {

        if (Array.isArray(position) && position.length >= 2 && Number.isFinite(Number(position[0])) && Number.isFinite(Number(position[1]))) {
          dialogue.x = Number(position[0]);
          dialogue.y = Number(position[1]);
          dialogue.hasSavedPosition = true;

          dialogue.x = dialogue.defaultX ?? 120;

    function collectValidationMessages() {
      const messages = [];
      const chapter = getSelectedChapter();
      if (chapter) {
        if (!chapter.id) {
          messages.push({ kind: "error", text: "챕터 ID가 비어 있습니다." });
        }
        if (!chapter.title) {
          messages.push({ kind: "warning", text: `${chapter.id}: 챕터 이름이 비어 있습니다.` });
        }
        if (!chapter.start_dialogue) {
          messages.push({ kind: "warning", text: `${chapter.id}: 시작 대화가 지정되지 않았습니다.` });
        } else if (!state.byId.has(chapter.start_dialogue)) {
          messages.push({ kind: "error", text: `${chapter.id}: 시작 대화가 없습니다 (${chapter.start_dialogue}).` });
        } else if (!chapter.dialogueIds.includes(chapter.start_dialogue)) {
          messages.push({ kind: "warning", text: `${chapter.id}: 시작 대화가 현재 챕터 캔버스에 배치되어 있지 않습니다.` });
        }
        chapter.dialogueIds.forEach((dialogueId) => {
          if (!state.byId.has(dialogueId)) {
            messages.push({ kind: "error", text: `${chapter.id}: 존재하지 않는 대화가 챕터에 포함되어 있습니다 (${dialogueId}).` });
          }
        });
      }

      state.dialogues.forEach((dialogue) => {
        if (dialogue.next && !state.byId.has(dialogue.next)) {
          messages.push({ kind: "error", text: `${dialogue.id}: next_dialogue 대상이 없습니다 (${dialogue.next}).` });
        }
        if (dialogue.next === dialogue.id) {
          messages.push({ kind: "error", text: `${dialogue.id}: 자기 자신으로 연결되어 있습니다.` });
        }
        if (chapter && chapter.dialogueIds.includes(dialogue.id) && dialogue.next && state.byId.has(dialogue.next) && !chapter.dialogueIds.includes(dialogue.next)) {
          messages.push({ kind: "warning", text: `${dialogue.id}: 다음 대화가 현재 챕터 캔버스에 배치되어 있지 않습니다 (${dialogue.next}).` });
        }
      });

      const roots = state.dialogues.filter((dialogue) => getIncomingIds(dialogue.id).length === 0);
      if (state.dialogues.length > 0 && roots.length === 0) {
        messages.push({ kind: "warning", text: "들어오는 연결이 없는 시작 후보가 없습니다." });
      }

      const visited = new Set();
      const stack = new Set();
      const cycleStarts = new Set();
      const visit = (id) => {
        if (stack.has(id)) {
          cycleStarts.add(id);
          return;
        }
        if (visited.has(id)) return;
        visited.add(id);
        stack.add(id);
        const next = state.byId.get(id)?.next || "";
        if (next && state.byId.has(next)) visit(next);
        stack.delete(id);
      };
      state.dialogues.forEach((dialogue) => visit(dialogue.id));
      cycleStarts.forEach((id) => {
        messages.push({ kind: "warning", text: `${id}: 순환 연결이 감지되었습니다.` });
      });

      if (messages.length === 0) {
        messages.push({ kind: "ok", text: "검증 경고가 없습니다." });
      }
      return messages;
    }

	    function renderValidation() {
